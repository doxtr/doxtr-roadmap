name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build "doxtr-pdf-theme-core>=1.1.9"
    - name: Build package
      run: python -m build
    - name: Install package with test extras
      run: pip install -e ".[dev]" || pip install -e .
    - name: Install test dependencies
      run: pip install pytest pytest-cov sphinxcontrib-plantuml "doxtr-pdf-theme-core>=1.1.9"
    - name: Run unit tests with coverage
      # No plantuml binary required — all subprocess calls are monkeypatched
      run: python -m pytest tests/ -v --tb=short --cov=doxtr_roadmap --cov-fail-under=75
    - name: Verify import
      run: python -c "import doxtr_roadmap; print(doxtr_roadmap.__version__)"
